<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/game.css">
    <link
      rel="icon"
      href="../res/favicon (3).png"
      sizes="32x32"
      type="image/png"
    />
    <title>Kings & Pigs</title>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-box">
        <h1 class="loader-title">ENTERING KINGDOM...</h1>

        <div class="pixel-progress-bar">
          <div class="pixel-progress-fill" id="load-fill"></div>
        </div>

        <p class="loader-status" id="load-status">Waking up pigs...</p>
      </div>
    </div>

    <div id="level-cleared-screen" style="display: none">
      <div class="cleared-board">
        <h1 class="cleared-title">LEVEL CLEARED!</h1>

        <div class="cleared-stats">
          <div class="stat-row">
            <span>TIME:</span>
            <span class="stat-value" id="clear-time">00:00</span>
          </div>
          <div class="stat-row">
            <span>GEMS:</span>
            <span class="stat-value" id="clear-gems">0</span>
          </div>
        </div>

        <button class="continue-btn" id="btn-continue">CONTINUE</button>
      </div>
    </div>

    <div id="game-over-screen" style="display: none">
      
      <canvas id="rain-canvas"></canvas>

      <div class="game-over-board">
        <div class="game-over-header">
          <h1 class="game-over-title">GAME OVER</h1>
        </div>

        <svg
          class="death-icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 12 12"
          shape-rendering="crispEdges"
        >
          <path
            fill="#e27b66"
            d="M3,2 h6 v1 h1 v1 h1 v3 h-1 v2 h-1 v2 h-1 v-1 h-2 v1 h-1 v-2 h-1 v-2 h-1 v-3 h1 v-1 h1 v-1 z"
          />
          <path
            fill="#2f242c"
            d="M4,5 h1 v2 h-1 z M7,5 h1 v2 h-1 z M5,8 h2 v1 h-2 z"
          />
        </svg>

        <p class="game-over-subtitle">The pigs got the best of you...</p>

        <div class="game-over-actions">
          <button class="action-btn retry-btn" id="btn-retry">RETRY</button>
          <button class="action-btn menu-btn" id="btn-menu">MENU</button>
        </div>
      </div>
    </div>

    <canvas id="game-canvas"></canvas>
    
    <script>
      document.addEventListener("keydown", (e) => {
        if (e.key == "Escape") {
          window.location.href = "../../index.html";
        }
      });
    </script>
    <script type="module" src="./Main.js"></script>
  </body>
</html>
