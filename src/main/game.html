<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/game.css">
    <link
      rel="icon"
      href="../res/favicon (3).png"
      sizes="32x32"
      type="image/png"
    />
    <title>Kings & Pigs</title>
    
    <style>
      #death-sprite-canvas {
        width: 128px; 
        height: 128px;
        position: relative;
        transform: scale(2);
        margin: 0 auto 16px auto;
        display: block;
        image-rendering: pixelated; 
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loader-box">
        <h1 class="loader-title">ENTERING KINGDOM...</h1>

        <div class="pixel-progress-bar">
          <div class="pixel-progress-fill" id="load-fill"></div>
        </div>

        <p class="loader-status" id="load-status">Waking up pigs...</p>
      </div>
    </div>

    <div id="level-cleared-screen" style="display: none">
      <div class="victory-glow"></div>

      <div class="cleared-board">
        <div class="cleared-header">
          <h1 class="cleared-title">VICTORY!</h1>
        </div>
        
        <p class="level-subtitle">World 1 - Piggy Pastures</p>

        <div class="victory-stars">
          <span class="star" style="--delay: 0.2s">★</span>
          <span class="star center-star" style="--delay: 0.4s">★</span>
          <span class="star" style="--delay: 0.6s">★</span>
        </div>

        <div class="cleared-content-split">
          
          <div class="cleared-stats">
            <div class="stat-row"><span>TIME:</span><span class="stat-value" id="clear-time">01:24</span></div>
            <div class="stat-row"><span>GEMS:</span><span class="stat-value" id="clear-gems">15/20</span></div>
            <div class="stat-row"><span>PIGS:</span><span class="stat-value" id="clear-kills">8</span></div>
            <hr class="stat-divider">
            <div class="stat-row total-score"><span>SCORE:</span><span class="stat-value text-gold" id="clear-score">4500</span></div>
          </div>

          <div class="rank-box">
            <span class="rank-label">RANK</span>
            <span class="rank-value s-rank">S</span>
          </div>

        </div>

        <div class="game-over-actions">
          <button class="action-btn menu-btn" id="btn-map">MENU</button>
          <button class="action-btn retry-btn" id="btn-replay">REPLAY</button>
          <button class="action-btn continue-btn" id="btn-next">NEXT</button>
        </div>
      </div>
    </div>

    <div id="game-over-screen" style="display: none">
      
      <canvas id="rain-canvas"></canvas>

      <div class="game-over-board">
        <div class="game-over-header">
          <h1 class="game-over-title">GAME OVER</h1>
        </div>

        <canvas id="death-sprite-canvas" width="128" height="128"></canvas>

        <p class="game-over-subtitle">The pigs got the best of you...</p>

        <div class="game-over-actions">
          <button class="action-btn retry-btn" id="btn-retry">RETRY</button>
          <button class="action-btn menu-btn" id="btn-menu">MENU</button>
        </div>
      </div>
    </div>

    <div id="hud-container">
      <button id="btn-pause" class="hud-btn">II</button>
    </div>

    <div id="pause-screen" style="display: none;">
      <div class="pause-board">
        
        <div class="pause-actions">
          <button class="action-btn resume-btn" id="btn-resume">RESUME</button>
          <button class="action-btn menu-btn" id="btn-pause-menu">MENU</button>
        </div>
        
      </div>
    </div>

    <canvas id="game-canvas"></canvas>
    
    <script type="module" src="./Main.js"></script>
    <script src="./js/deathAnimation.js"></script>
  </body>
</html>
